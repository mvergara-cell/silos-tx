<style>
/* Layout: app shell — rail nav on desktop, bottom bar on phones; six views (Inicio, Mapa, Solicitudes, Silos, Registrar, Análisis); forms and silo ficha open in a side sheet. */
:root{
  --brand:#e4032e; --brand-ink:#ffffff; --brand-soft:#fde7eb;
  --bg:#f2f2f0; --surface:#ffffff; --sunk:#eaeae7; --ink:#121212; --muted:#5e6066; --line:#dfdfdb;
  --ok:#18864a; --ok-soft:#ddf2e5; --warn:#b86e00; --warn-soft:#fbeed6; --bad:#c4121f; --bad-soft:#fbe1e3; --info:#2459a8; --info-soft:#e1eaf8;
  --sea:#dfe5ea; --land:#fbfbfa; --land-line:#c9cdd1; --steel-1:#f4f5f6; --steel-2:#c3c7cc; --steel-3:#8d939a;
  --f-ui:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --nav-w:84px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#ff2a4d; --brand-ink:#ffffff; --brand-soft:#3a0f18;
  --bg:#0c0d0f; --surface:#15171a; --sunk:#1d2024; --ink:#f1f1f1; --muted:#9a9da4; --line:#2a2d32;
  --ok:#4fd18a; --ok-soft:#13301f; --warn:#f2b04a; --warn-soft:#352813; --bad:#ff6670; --bad-soft:#3b1519; --info:#79a8f0; --info-soft:#152640;
  --sea:#0f1419; --land:#1b1f24; --land-line:#343a42; --steel-1:#d9dde1; --steel-2:#8c939b; --steel-3:#4d535a; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#ff2a4d; --brand-ink:#ffffff; --brand-soft:#3a0f18;
  --bg:#0c0d0f; --surface:#15171a; --sunk:#1d2024; --ink:#f1f1f1; --muted:#9a9da4; --line:#2a2d32;
  --ok:#4fd18a; --ok-soft:#13301f; --warn:#f2b04a; --warn-soft:#352813; --bad:#ff6670; --bad-soft:#3b1519; --info:#79a8f0; --info-soft:#152640;
  --sea:#0f1419; --land:#1b1f24; --land-line:#343a42; --steel-1:#d9dde1; --steel-2:#8c939b; --steel-3:#4d535a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* shell */
.rail{position:fixed;left:0;top:0;bottom:0;width:calc(var(--nav-w) + env(safe-area-inset-left,0px));padding:calc(14px + env(safe-area-inset-top,0px)) 10px 14px calc(10px + env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30}
.rail .mark{width:52px;color:var(--ink);margin-bottom:14px;display:block}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;padding:9px 4px;border-radius:12px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:10.5px;font-weight:600;letter-spacing:.02em;position:relative}
.navbtn svg{width:22px;height:22px}
.navbtn[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.navbtn .dot{position:absolute;top:6px;right:12px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-size:10px;line-height:16px;font-family:var(--f-mono)}
.navbtn.cta{background:var(--brand);color:var(--brand-ink);margin-top:auto}
.app{margin-left:calc(var(--nav-w) + env(safe-area-inset-left,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;padding-block:12px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.app .wrap{padding-left:20px}
.ttl{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.ttl small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700}
.ttl h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.topmark{display:none;width:44px;color:var(--ink)}
.bottom{display:none}
main{padding-block:22px 110px}
@media (max-width:480px){#top-actions .btn span{display:none}#top-actions .btn{padding:10px 12px}}
@media (max-width:820px){
  .rail{display:none}
  .app{margin-left:0}
  .app .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topmark{display:block}
  .ttl h1{font-size:18px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));justify-content:space-around}
  .bottom .navbtn{width:auto;flex:1;padding:7px 2px}
  .bottom .navbtn.cta{margin-top:0;flex:0 0 58px;border-radius:16px;transform:translateY(-14px);box-shadow:0 6px 18px color-mix(in srgb,var(--brand) 40%,transparent)}
}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;cursor:pointer;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.sec-h h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em}
.sec-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.plain::before{display:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:980px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.banner{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);font-size:13.5px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num{font-size:13px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}

/* hero */
.hero{--ink:#111214;--bg:#f3f3f1;--steel-1:#d9dde1;--steel-2:#8c939b;--steel-3:#4d535a;position:relative;overflow:hidden;border-radius:18px;background:var(--ink);color:var(--bg);padding:22px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;margin-bottom:18px}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(color-mix(in srgb,var(--bg) 7%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--bg) 7%,transparent) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(90deg,transparent,#000 60%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);pointer-events:none}

function recompute(){
  const evBy = new Map();
  for(const e of S.evs){ if(!evBy.has(e.siloId)) evBy.set(e.siloId, []); evBy.get(e.siloId).push(e); }
  for(const l of evBy.values()) l.sort((a,b) => (a.fecha||'').localeCompare(b.fecha||'') || (a.creadoEn||'').localeCompare(b.creadoEn||''));
  S.evBy = evBy;
  S.info = new Map();
  for(const s of S.silos){
    const evs = evBy.get(s.id) || [];
    const sol = S.sols.find(x => x.estado==='Instalada' && solHas(x, s.id)) || null;
    const open = new Map(); let cond = 'Operativo';
    const cnt = { fallas:0, rep:0, mant:0, insp:0, visitas:0, imput:0 };
    const g = { rep:0, mo:0, total:0 };
    let lastVisit = null, lastMant = null, lastPhotos = null;
    for(const e of evs){
      if(VISIT_TYPES.includes(e.tipo)){ cnt.visitas++; lastVisit = e; if((e.fotos||[]).length) lastPhotos = e; }
      if(e.tipo==='Falla'){ cnt.fallas++; if(e.imputable==='Sí, cliente') cnt.imput++; open.set(e.id, e);
        cond = (e.gravedad||'').startsWith('Grave') ? 'Detenido' : (cond==='Detenido' ? 'Detenido' : 'Con falla'); }
      if(e.tipo==='Reparación' || e.tipo==='Mantención'){
        if(e.tipo==='Reparación'){ cnt.rep++; if(e.fallaId) open.delete(e.fallaId); } else { cnt.mant++; lastMant = e; }
        g.rep += numRaw(e.totRep); g.mo += numRaw(e.mo) + numRaw(e.ext) + numRaw(e.otros); g.total += numRaw(e.total);
        if(e.operativo==='Sí'){ const rest = [...open.values()]; cond = !rest.length ? 'Operativo' : rest.some(f => (f.gravedad||'').startsWith('Grave')) ? 'Detenido' : 'Con falla'; }
        else if(e.operativo==='No') cond = 'En reparación';
      }
      if(e.tipo==='Inspección'){ cnt.insp++; lastMant = lastMant && lastMant.fecha > e.fecha ? lastMant : e; }
    }
    const stays = S.sols.filter(x => solHas(x, s.id) && x.fechaInstalacion);
    const diasAcum = stays.reduce((a,x) => a + daysBetween(x.fechaInstalacion, x.fechaRetiro || today()), 0);
    const ubic = s.activo===false ? 'De baja' : sol ? 'En obra' : 'En planta';
    S.info.set(s.id, { s, sol, prod: siloProd(sol, s.id), evs, cond: s.activo===false ? 'De baja' : cond, ubic, fallasAbiertas:[...open.values()], cnt, g,
      dias: sol && sol.fechaInstalacion ? daysBetween(sol.fechaInstalacion, today()) : null, diasAcum, instalaciones: stays.length,
      lastVisit, lastPhotos, lastMant });
  }
}

function parseCoords(txt){

  if(!m) return null; const lat = +m[1], lng = +m[2];

  return [lat, lng];
}

function makeMap(el, opts={}){
  if(!window.L) { el.innerHTML = '<div class="empty"><b>Mapa no disponible</b>No se pudo cargar el visor de mapas.</div>'; return null; }
  const m = L.map(el, { zoomControl: !opts.mini, attributionControl:true, minZoom:4, maxZoom:19, scrollWheelZoom: !opts.mini });
  m.attributionControl.setPrefix('');
  m.setView(opts.center || [-33.47,-70.65], opts.zoom || (opts.mini ? 9 : 10));
  const calles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, className:'tiles-calles', attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(m);
  // Respaldo: si OpenStreetMap bloquea las teselas (red corporativa, archivo abierto sin servidor), usa el mapa de calles de Esri
  let tileErr = 0, swapped = false;
  calles.on('tileerror', () => { if(swapped || ++tileErr < 3) return; swapped = true;
    calles.setUrl('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}');
    m.attributionControl.removeAttribution(calles.getAttribution()); calles.options.attribution = 'Mapa © Esri'; m.attributionControl.addAttribution('Mapa © Esri'); });
  if(window.ResizeObserver){ const ro = new ResizeObserver(() => { if(!m._dead) m.invalidateSize(); }); ro.observe(el); m.on('unload', () => ro.disconnect()); }
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'Imágenes © Esri' });
  if(!opts.mini){
    const Ctl = L.Control.extend({ onAdd(){ const d = L.DomUtil.create('div','seg-f map-layers'); d.innerHTML = '<button type="button" aria-pressed="true" data-l="c">Calles</button><button type="button" aria-pressed="false" data-l="s">Satélite</button>';
      L.DomEvent.disableClickPropagation(d);
      d.querySelectorAll('button').forEach(btn => btn.onclick = () => { const s = btn.dataset.l==='s'; if(s){ m.removeLayer(calles); sat.addTo(m); } else { m.removeLayer(sat); calles.addTo(m); } d.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x===btn))); });
      return d; } });
    new Ctl({ position:'topright' }).addTo(m);
  }
  m.on('unload', () => { m._dead = true; });
  m._markers = L.layerGroup().addTo(m);
  return m;
}

const dKey = s => String(s||'').normalize('NFD').replace(/[^\x00-\x7F]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const rutKey = r => String(r||'').toUpperCase().replace(/[^0-9K]/g,'');
const tonF = n => (Math.round((+n||0)*10)/10).toLocaleString('es-CL', { maximumFractionDigits:1 });
function indexDesp(rows){
  const byRut = new Map(), byCli = new Map(), add = (m,k,r) => { if(!m.has(k)) m.set(k, []); m.get(k).push(r); };
  for(const r of rows){ add(byRut, rutKey(r.rut) + '|' + (r.obra_key || dKey(r.obra)), r); add(byCli, dKey(r.cliente) + '|' + (r.obra_key || dKey(r.obra)), r); }
  S.desp = { rows, byRut, byCli, hasta: rows.reduce((a,r) => r.fecha > a ? r.fecha : a, '') };
}
// Despachos de la obra de una solicitud: concatena cliente (RUT o razón social) + obra
function despSol(s){
  if(!S.desp || !s) return [];
  const ob = dKey(s.obraSAP || s.obra);
  return S.desp.byRut.get(rutKey(s.rut) + '|' + ob) || S.desp.byCli.get(dKey(s.cliente) + '|' + ob) || [];
}
function despResumen(rows){
  const d = rows.filter(r => r.tipo !== 'Reingreso');
  const ult = d.filter(r => +r.ton > 0).reduce((a,r) => !a || r.fecha > a.fecha ? r : a, null);
  const ton = rows.reduce((a,r) => a + (+r.ton||0), 0), dev = rows.reduce((a,r) => a + (+r.ton_dev||0), 0), neta = rows.reduce((a,r) => a + (+r.ton_neta||0), 0);
  const guias = new Set(d.map(r => r.guia)).size;
  return { ult, ton, dev, neta, guias, dias: ult ? daysBetween(ult.fecha, today()) : null };
}
function despSilo(i){
  const rows = despSol(i.sol);
  const code = i.prod?.codigo;
  const own = code ? rows.filter(r => r.codigo === code) : rows;
  return own.length ? own : rows;
}
function despBlock(rows, titulo, nota){

      <div><small>Último despacho</small><b style="font-size:17px">${r.ult ? fmtD(r.ult.fecha) : '–'}</b>${r.dias!=null ? `<div class="sub">hace ${r.dias} días</div>` : ''}</div>

const VIEWS = [
  { id:'inicio', label:'Inicio', icon:I.home, title:'Inicio' },
  { id:'mapa', label:'Mapa', icon:I.map, title:'Mapa de silos' },
  { id:'solicitudes', label:'Solicitudes', icon:I.flow, title:'Solicitudes e instalación' },

  { id:'registrar', label:'Registrar', icon:I.plus, title:'Registrar visita', cta:true, need:'tec' },
  { id:'usuarios', label:'Usuarios', icon:I.users, title:'Usuarios y perfiles', need:'admin' },
];
const PERM = { sol:['vendedor','supervisor','admin'], eval:['supervisor','admin'], tec:['tecnico','supervisor','admin'], silo:['supervisor','admin'], admin:['admin'] };
const can = k => (PERM[k] || []).includes(S.rol);
const allowed = v => { const x = VIEWS.find(y => y.id===v); return !!x && (!x.need || can(x.need)); };
function buildNav(){
  const vis = VIEWS.filter(v => !v.need || can(v.need));
  const solicitar = { id:'_sol', label:'Solicitar', icon:I.plus, cta:true };
  const btn = (v, bottom) => v.id==='_sol' ? `<button class="navbtn cta" data-act="new-sol" aria-label="Solicitar silo">${v.icon}${bottom ? '' : '<span>Solicitar</span>'}</button>`
    : `<button class="navbtn ${v.cta?'cta':''}" data-view="${v.id}" aria-label="${v.label}">${v.icon}${v.cta && bottom ? '' : `<span>${v.label}</span>`}${v.id==='solicitudes'?'<span class="dot" data-badge hidden></span>':''}${v.id==='usuarios'?'<span class="dot" data-badge-u hidden></span>':''}</button>`;
  const rail = vis.filter(v => !v.cta).concat(can('tec') ? [VIEWS.find(v => v.id==='registrar')] : can('sol') ? [solicitar] : []);
  $('#nav-rail').innerHTML = rail.map(v => btn(v, false)).join('');
  const order = ['inicio','mapa', can('tec') ? 'registrar' : can('sol') ? '_sol' : null, 'solicitudes','silos','analisis'].filter(Boolean);
  $('#nav-bottom').innerHTML = order.map(id => id==='_sol' ? solicitar : VIEWS.find(v => v.id===id)).map(v => btn(v, true)).join('');
  $$('.navbtn[data-view]').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
}
function go(v, opts){
  if(!allowed(v)) v = 'inicio';
  S.view = v;
  $$('.navbtn[data-view]').forEach(b => { if(b.dataset.view===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  VIEWS.forEach(x => $('#v-'+x.id).hidden = x.id!==v);
  $('#view-title').textContent = VIEWS.find(x => x.id===v).title;
  try{ localStorage.setItem('silos360.view', v); }catch(e){}
  renderTopActions();
  render(opts);
  window.scrollTo(0,0);
}
function renderTopActions(){
  const a = $('#top-actions'); const v = S.view;
  let h = '';
  if((v==='solicitudes' || v==='inicio') && can('sol')) h += `<button class="btn primary" data-act="new-sol">${I.plus}<span>Nueva solicitud</span></button>`;
  if(v==='silos' && can('silo')) h += `<button class="btn primary" data-act="new-silo">${I.plus}<span>Agregar silo</span></button>`;
  if(v==='analisis' && S.downloads) h += `<button class="btn" data-act="csv">${I.download}<span>Exportar CSV</span></button>`;
  a.innerHTML = h;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-open-silo],[data-open-sol]');
  if(!t) return;
  if(t.dataset.openSilo){ openSilo(t.dataset.openSilo); return; }
  if(t.dataset.openSol){ openSol(t.dataset.openSol); return; }
  const act = t.dataset.act;
  if(act==='new-sol') formSolicitud();
  if(act==='new-silo') formSilo();
  if(act==='csv') exportCSV();
  if(act==='go') go(t.dataset.to);
});

function renderSilos(){

    el.dataset.built = '1';
    el.innerHTML = `<div class="mapbar"><div class="seg-f" role="group" aria-label="Filtro" id="silos-f"><button data-f="todos">Todos</button><button data-f="obra">En obra</button><button data-f="planta">En planta</button><button data-f="falla">Con falla</button><button data-f="baja">De baja</button></div>
      <input id="silos-q" type="search" placeholder="Buscar código, obra o cliente" style="max-width:320px" aria-label="Buscar silos"></div><div id="silos-grid"></div>`;
    $$('#silos-f button').forEach(b => b.onclick = () => { S.f.silos = b.dataset.f; renderSilos(); });
    $('#silos-q').addEventListener('input', e => { S.f.silosQ = e.target.value; renderSilos(); });
  }
  $$('#silos-f button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f===S.f.silos)));
  const box = $('#silos-grid');

  if(!S.silos.length){ box.innerHTML = `<div class="card empty"><b>Sin silos registrados</b>Agrega cada silo con su código (ej. SIL-01), capacidad y modelo.<br><button class="btn primary" data-act="new-silo">${I.plus}Agregar silo</button></div>`; return; }
  const q = norm(S.f.silosQ), f = S.f.silos;

  box.innerHTML = list.length ? `<div class="silos-grid">${list.map(i => `<button class="sc" data-open-silo="${esc(i.s.id)}">
    ${siloSVG(i.cond,'silo',i.s.codigo)}

      <div class="loc">${i.sol ? `${esc(i.sol.obra)} · ${esc(i.sol.cliente)}${i.prod ? ` · <span class="mono">${esc(i.prod.codigo)}</span>` : ''}` : esc(i.s.planta || (i.ubic==='De baja' ? 'Fuera de servicio' : 'Disponible en planta'))}${i.s.capacidad ? ` · ${esc(i.s.capacidad)} ton` : ''}</div>
      ${i.sol && i.ubic==='En obra' && S.desp ? (() => { const r = despResumen(despSilo(i)); return r.ult ? `<div class="sub">Último despacho <b>${fmtD(r.ult.fecha)}</b> · ${tonF(r.neta)} t despachadas a la obra</div>` : '<div class="sub">Sin despachos en SAP</div>'; })() : ''}
      ${condChip(i.cond)}
      <div class="stats"><div><b>${i.dias ?? '–'}</b><small>días</small></div><div><b>${i.cnt.fallas}</b><small>fallas</small></div><div><b>${clpK(i.g.total)}</b><small>gasto</small></div></div>
    </div>
    <div class="thumb">${i.lastPhotos ? i.lastPhotos.fotos.slice(0,3).map(p => `<img src="${esc(p.url)}" alt="" loading="lazy">`).join('') + `<span class="sub">Última foto ${fmtD(i.lastPhotos.fecha)}</span>` : `<span class="sub">${i.lastVisit ? 'Última visita ' + fmtD(i.lastVisit.fecha) : 'Sin visitas registradas'}</span>`}</div>

/* ---- ficha silo ---- */
function evText(e){
  const p = [];
  if(e.tipo==='Instalación') p.push(`${esc(e.obra)} · ${esc(e.cliente)}`, e.material ? 'Material: ' + esc(e.material) : '');
  if(e.tipo==='Desinstalación') p.push(`Desde ${esc(e.obra)} · Motivo: ${esc(e.motivo||'–')}`, 'Estado al retiro: ' + esc(e.estadoRetiro||'–'));
  if(e.tipo==='Falla') p.push(`<b>${esc(e.componente)}</b> · ${esc(e.gravedad)}`, `Causa: ${esc(e.causa)} · Responsable: ${esc(e.imputable)}`, esc(e.descripcion));
  if(e.tipo==='Reparación' || e.tipo==='Mantención'){
    if(e.tipo==='Reparación'){ const f = e.fallaId && S.evs.find(x => x.id===e.fallaId); p.push(f ? `Resuelve: ${esc(f.componente)} (${fmtD(f.fecha)})` : 'Sin falla asociada'); }
    else p.push(esc(e.tipoMant || 'Mantención'));
    p.push(esc(e.trabajo));
    if((e.repuestos||[]).length) p.push('Repuestos: ' + e.repuestos.map(r => `${esc(r.d)} ×${esc(r.c)} ${esc(r.u)}`).join(', '));
    p.push(`<b class="mono">${clp(e.total)}</b>${e.nOT ? ` · OT ${esc(e.nOT)}` : ''}${e.hh ? ` · ${esc(e.hh)} HH` : ''} · Operativo: ${esc(e.operativo||'–')}${e.tipo==='Reparación' ? ` · Cobro cliente: ${esc(e.cargo||'–')}` : ''}`);
  }
  if(e.tipo==='Inspección') p.push('Resultado: ' + esc(e.resultado));
  if(e.estado) p.push(`Estado del silo: <b>${esc(e.estado)}</b>`);
  if(e.obs) p.push(`<span class="sub">${esc(e.obs)}</span>`);
  return p.filter(Boolean).map(x => `<p>${x}</p>`).join('');
}

const val = (id, root=document) => { const e = root.querySelector('#'+id); return e ? String(e.value).trim() : ''; };
const radio = (name, root=document) => root.querySelector(`input[name="${name}"]:checked`)?.value || '';
function photoField(id, label='Fotos'){
  return `<div style="display:grid;gap:8px">${S.assets ? fld(label + ' <span class="sub" style="font-weight:400">(desde la cámara o galería)</span>', `<input id="${id}" type="file" accept="image/*" multiple>`) : `<p class="sub" style="margin:0">No se pueden adjuntar fotos en este momento.</p>`}<div class="previews" id="${id}-pv"></div></div>`;
}
function wirePhotos(id, root){
  const i = root.querySelector('#'+id); if(!i) return;
  i.addEventListener('change', () => {
    const pv = root.querySelector('#'+id+'-pv'); pv.innerHTML = '';
    Array.from(i.files).slice(0,8).forEach(f => { const u = URL.createObjectURL(f); pv.insertAdjacentHTML('beforeend', `<img src="${u}" alt="Vista previa">`); });
  });
}
async function compress(file){
  try{
    if(!file.type.startsWith('image/') || file.size < 350000) return file;
    const url = URL.createObjectURL(file); const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);

}

/* location picker */
function picker(root, lat, lng, comunaInputId){
  const el = root.querySelector('#pk-map'); const m = makeMap(el, { center: (lat && lng) ? [lat,lng] : [-33.47,-70.65], zoom: (lat && lng) ? 15 : 9 });
  if(!m) return { get:() => [lat||null, lng||null] };
  let mk = null, cur = (lat && lng) ? [lat,lng] : null;
  const set = (ll, pan) => { cur = ll; if(mk) mk.setLatLng(ll); else mk = L.marker(ll, { icon:pinIcon('Operativo'), draggable:true }).addTo(m).on('dragend', () => { const p = mk.getLatLng(); cur = [+p.lat.toFixed(6), +p.lng.toFixed(6)]; note(); }); if(pan) m.setView(ll, Math.max(m.getZoom(), 15)); note(); };
  const note = () => { root.querySelector('#pk-note').textContent = cur ? `Punto marcado: ${cur[0].toFixed(5)}, ${cur[1].toFixed(5)}` : 'Toca el mapa en el lugar exacto donde irá el silo, o pega un enlace de Google Maps.'; };
  if(cur) set(cur);
  note();
  m.on('click', e => set([+e.latlng.lat.toFixed(6), +e.latlng.lng.toFixed(6)]));
  root.querySelector('#pk-gps').onclick = () => {
    if(!navigator.geolocation) return toast('Este dispositivo no entrega ubicación');
    const b = root.querySelector('#pk-gps'); b.disabled = true; b.lastChild.textContent = 'Buscando…';
    navigator.geolocation.getCurrentPosition(p => { b.disabled = false; b.lastChild.textContent = 'Usar mi ubicación'; set([+p.coords.latitude.toFixed(6), +p.coords.longitude.toFixed(6)], true); toast('Ubicación marcada (±' + Math.round(p.coords.accuracy) + ' m)'); },
      e => { b.disabled = false; b.lastChild.textContent = 'Usar mi ubicación'; toast(e.code===1 ? 'Permiso de ubicación denegado' : 'No se pudo obtener la ubicación'); }, { enableHighAccuracy:true, timeout:15000, maximumAge:30000 });
  };
  root.querySelector('#pk-paste').addEventListener('input', e => { const ll = parseCoords(e.target.value); if(ll) set(ll, true); });
  if(comunaInputId) root.querySelector('#'+comunaInputId).addEventListener('change', e => { loadGeo().then(() => { const ll = comunaLL(e.target.value); if(ll && !cur) m.setView(ll, 13); }); });
  setTimeout(() => m.invalidateSize(), 80);
  S.sheetCleanup = () => m.remove();
  return { get:() => cur || [null,null] };
}

const normRut = r => { const t = String(r||'').toUpperCase().replace(/[^0-9K]/g,''); return t.length < 2 ? t : t.slice(0,-1) + '-' + t.slice(-1); };
function rutOk(r){
  const m = normRut(r).match(/^(\d{6,9})-([0-9K])$/); if(!m) return false;
  let s = 0, k = 2; for(let i = m[1].length - 1; i >= 0; i--){ s += +m[1][i] * k; k = k === 7 ? 2 : k + 1; }
  const d = 11 - (s % 11); return m[2] === (d === 11 ? '0' : d === 10 ? 'K' : String(d));
}
const fmtMes = d => { if(!d) return ''; const [y,m] = d.split('-'); return `${MESES[+m-1]} ${y}`; };

/* ================= ANÁLISIS ================= */
const PERIODOS = [['30','30 días'],['90','90 días'],['12m','12 meses'],['anio','Año en curso'],['todo','Todo']];
function periodStart(){
  const p = S.f.periodo, t = today();
  if(p==='30' || p==='90'){ const d = new Date(); d.setDate(d.getDate() - Number(p)); return d.toISOString().slice(0,10); }
  if(p==='12m'){ const d = new Date(); d.setMonth(d.getMonth() - 11, 1); return d.toISOString().slice(0,7) + '-01'; }
  if(p==='anio') return t.slice(0,4) + '-01-01';
  return '0000-00-00';
}
function monthsRange(start){
  const t = today().slice(0,7);
  let first = start==='0000-00-00' ? (S.evs.map(e => e.fecha).filter(Boolean).sort()[0] || today()).slice(0,7) : start.slice(0,7);
  const out = []; let [y,m] = first.split('-').map(Number);
  while(true){ const k = `${y}-${pad(m)}`; out.push(k); if(k >= t || out.length > 36) break; m++; if(m > 12){ m = 1; y++; } }
  return out.slice(-24);
}
function barChart(months, series, opt={}){
  const W = 640, H = 230, L0 = 52, B = 26, T = 12, R = 8;
  const totals = months.map((_,k) => opt.stacked ? series.reduce((a,s) => a + s.v[k], 0) : Math.max(...series.map(s => s.v[k])));
  let max = Math.max(1, ...totals); const mag = Math.pow(10, Math.floor(Math.log10(max))); max = Math.ceil(max / mag) * mag;
  const y = v => T + (H - T - B) * (1 - v / max), bw = (W - L0 - R) / months.length;
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  let g = `<g class="grid">${ticks.map(v => `<line x1="${L0}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L0-6}" y="${y(v)+3}" text-anchor="end">${opt.fmt ? opt.fmt(v) : v}</text>`).join('')}</g>`;
  months.forEach((mk, k) => {
    const x0 = L0 + k * bw;
    if(opt.stacked){ let acc = 0; series.forEach(s => { const v = s.v[k]; if(v > 0){ g += `<rect x="${x0 + bw*.18}" y="${y(acc + v)}" width="${bw*.64}" height="${y(acc) - y(acc + v)}" rx="2" style="fill:${s.c}"><title>${s.n}: ${opt.fmt ? opt.fmt(v) : v}</title></rect>`; } acc += v; }); }
    else { const w = bw * .7 / series.length; series.forEach((s, j) => { const v = s.v[k]; if(v > 0) g += `<rect x="${x0 + bw*.15 + j*w}" y="${y(v)}" width="${w - 1}" height="${y(0) - y(v)}" rx="2" style="fill:${s.c}"><title>${s.n}: ${v}</title></rect>`; }); }

const TBL = {
  silos:       d => ({ codigo:d.codigo }),

};
const cache = { silos:new Map(), solicitudes:new Map(), eventos:new Map() };
const subs = { silos:[], solicitudes:[], eventos:[] };
const rowDoc = r => ({ ...(r.data || {}), id:r.id, autorId:(r.data && r.data.autorId) || r.created_by });
const clean = o => { const c = JSON.parse(JSON.stringify(o)); delete c.id; return c; };
function emit(t){ const docs = [...cache[t].values()].map(d => ({ id:d.id, data:() => d })); subs[t].forEach(fn => fn({ docs })); }
async function fetchAll(t){
  let all = [];
  for(let from = 0; ; from += 1000){
    const { data, error } = await sb.from(t).select('*').order('created_at').range(from, from + 999);
    if(error) throw error; all = all.concat(data); if(data.length < 1000) break;
  }
  cache[t] = new Map(all.map(r => [r.id, rowDoc(r)])); emit(t);
}
const dbErr = e => { const x = new Error(e?.message || 'error'); x.code = (e?.code==='42501' || /row-level security|permission/i.test(e?.message||'')) ? 'invalid_argument' : e?.code==='23505' ? 'duplicado' : 'unavailable'; if(x.code==='invalid_argument') x.message = 'Tu perfil no tiene permiso para esta acción.'; if(x.code==='duplicado') x.message = 'Ya existe un registro con ese código.'; return x; };
const sbDB = {
  collection(t){
    const q = {
      orderBy(){ return q; }, limit(){ return q; },
      onSnapshot(fn, onErr){ subs[t].push(fn); fetchAll(t).catch(e => onErr && onErr({ code:e.code || 'unavailable', message:e.message })); return () => { subs[t] = subs[t].filter(f => f!==fn); }; },
      async add(obj){
        const d = clean(obj);
        const { data, error } = await sb.from(t).insert({ ...TBL[t](d), data:d }).select().single();
        if(error) throw dbErr(error); cache[t].set(data.id, rowDoc(data)); emit(t); return { id:data.id };
      },
      doc(id){ return sbDB.doc(t + '/' + id); },
    };
    return q;
  },
  doc(path){
    const [t, id] = path.split('/');
    return {
      async update(obj){
        const merged = clean({ ...(cache[t].get(id) || {}), ...obj });
        const { data, error } = await sb.from(t).update({ ...TBL[t](merged), data:merged }).eq('id', id).select();
        if(error) throw dbErr(error); if(!data || !data.length) throw dbErr({ code:'42501' });
        cache[t].set(id, rowDoc(data[0])); emit(t);
      },
      async delete(){
        const { data, error } = await sb.from(t).delete().eq('id', id).select('id');
        if(error) throw dbErr(error); if(!data || !data.length) throw dbErr({ code:'42501' });
        cache[t].delete(id); emit(t);
      },
    };
  },
};

}
function loadClientLists(){
  if(S._cliLists || !S.clientes) return; S._cliLists = true;
  $('#dl-ruts').innerHTML = S.clientes.map(c => `<option value="${esc(c.rut)}">${esc(c.razon_social)}</option>`).join('');
  $('#dl-clientes').innerHTML = S.clientes.map(c => `<option value="${esc(c.razon_social)}">${esc(c.rut)}</option>`).join('');
}

/* ================= roles ================= */
const ROLES = { admin:'Administrador', supervisor:'Supervisor (evalúa y gestiona flota)', tecnico:'Técnico (instala, mantiene, repara, retira)', vendedor:'Vendedor (solicita silos)', pendiente:'Pendiente de aprobación' };
const ROL_CORTO = { admin:'Admin', supervisor:'Supervisor', tecnico:'Técnico', vendedor:'Vendedor', pendiente:'Pendiente' };

/* ================= usuarios (admin) ================= */
async function renderUsuarios(){
  const el = $('#v-usuarios');
  if(!can('admin')){ el.innerHTML = '<div class="card empty"><b>Solo administradores</b></div>'; return; }
  if(!el.dataset.built){ el.dataset.built = '1'; el.innerHTML = `<div class="sec-h"><div><h2>Perfiles de usuario</h2><p>Cada persona crea su cuenta con su correo en la pantalla de ingreso. Aquí le asignas el perfil: hasta entonces no ve datos.</p></div><button class="btn" id="u-reload">Actualizar</button></div><div id="u-list" class="card tbl-wrap"><div class="empty"><b>Cargando…</b></div></div>
    <div class="grid g2 block">${Object.entries(ROLES).filter(([k]) => k!=='pendiente').map(([k,v]) => `<div class="card" style="padding:14px"><b>${ROL_CORTO[k]}</b><div class="sub">${({ admin:'Todo, incluida la gestión de usuarios y eliminar registros.', supervisor:'Evalúa prefactibilidad, gestiona la flota de silos, instala y registra visitas.', tecnico:'Instala, desinstala y registra fallas, reparaciones, mantenciones e inspecciones con fotos.', vendedor:'Crea solicitudes de silo y puede editar o anular las suyas mientras no se instalen. Ve el panel, mapa y análisis.' })[k]}</div></div>`).join('')}</div>`;
    $('#u-reload').onclick = () => { delete S.users; renderUsuarios(); };
  }
  if(!S.users){
    const { data, error } = await sb.from('profiles').select('*').order('created_at');
    if(error){ $('#u-list').innerHTML = `<div class="empty"><b>No se pudo cargar</b>${esc(error.message)}</div>`; return; }
    S.users = data;
  }
  const list = S.users.slice().sort((a,b) => (a.rol==='pendiente' ? 0 : 1) - (b.rol==='pendiente' ? 0 : 1) || String(a.nombre).localeCompare(String(b.nombre),'es'));
  $('#u-list').innerHTML = `<table><thead><tr><th>Nombre</th><th>Correo</th><th>Perfil</th><th>Estado</th><th class="r">Alta</th></tr></thead><tbody>${list.map(u => `<tr>
    <td><b>${esc(u.nombre||'')}</b>${u.id===S.uid ? ' <span class="chip plain">tú</span>' : ''}</td><td class="sub">${esc(u.email||'')}</td>
    <td><select data-u-rol="${esc(u.id)}" aria-label="Perfil de ${esc(u.nombre)}" ${u.id===S.uid ? 'disabled' : ''} style="min-width:150px">${Object.keys(ROLES).map(k => `<option value="${k}"${k===u.rol?' selected':''}>${ROL_CORTO[k]}</option>`).join('')}</select></td>
    <td>${u.id===S.uid ? '<span class="chip ok">Activo</span>' : `<button class="btn sm ${u.activo ? '' : 'danger'}" data-u-act="${esc(u.id)}">${u.activo ? 'Activo' : 'Bloqueado'}</button>`}</td>
    <td class="r sub">${fmtD((u.created_at||'').slice(0,10))}</td></tr>`).join('')}</tbody></table>`;
  $$('[data-u-rol]').forEach(s => s.onchange = async () => {
    const { error } = await sb.from('profiles').update({ rol:s.value }).eq('id', s.dataset.uRol);
    if(error){ toast('No se pudo cambiar el perfil'); } else { const u = S.users.find(x => x.id===s.dataset.uRol); u.rol = s.value; toast(`${u.nombre}: ${ROL_CORTO[s.value]}`); updateBadges(); renderUsuarios(); }
  });
  $$('[data-u-act]').forEach(b => b.onclick = async () => {
    const u = S.users.find(x => x.id===b.dataset.uAct);
    const { error } = await sb.from('profiles').update({ activo:!u.activo }).eq('id', u.id);
    if(error) toast('No se pudo cambiar el estado'); else { u.activo = !u.activo; renderUsuarios(); }
  });
}
function updateBadges(){
  const n = (S.users||[]).filter(u => u.rol==='pendiente').length;
  $$('[data-badge-u]').forEach(b => { b.hidden = !n; b.textContent = n; });
}

/* ================= ingreso ================= */
function authScreen(mode='login', msg=''){
  const a = $('#auth'); a.hidden = false; $('#app-shell').hidden = true;
  const titles = { login:'Ingresar', signup:'Crear cuenta', reset:'Recuperar contraseña', newpass:'Nueva contraseña' };
  a.querySelector('.auth-form').innerHTML = `
    <h2>${titles[mode]}</h2>
    ${msg ? `<div class="ctx" style="margin-bottom:4px">${msg}</div>` : ''}
    <form id="af" class="form" novalidate style="gap:12px">
      ${mode==='signup' ? fld('Nombre y apellido', '<input id="a-nombre" autocomplete="name">', 1) : ''}
      ${mode!=='newpass' ? fld('Correo', '<input id="a-email" type="email" autocomplete="email" inputmode="email">', 1) : ''}
      ${mode!=='reset' ? fld(mode==='newpass' ? 'Nueva contraseña' : 'Contraseña', `<input id="a-pass" type="password" autocomplete="${mode==='login' ? 'current-password' : 'new-password'}" minlength="8">`, 1) : ''}
      <div class="ctx err" id="a-err" hidden></div>
      <button class="btn primary" id="a-go" style="width:100%;padding:13px">${{ login:'Ingresar', signup:'Crear cuenta', reset:'Enviar enlace', newpass:'Guardar contraseña' }[mode]}</button>
    </form>
    <div class="auth-links">${mode==='login' ? '<button data-auth="signup">Crear cuenta nueva</button><button data-auth="reset">Olvidé mi contraseña</button>' : '<button data-auth="login">Volver a ingresar</button>'}</div>`;
  a.querySelectorAll('[data-auth]').forEach(b => b.onclick = () => authScreen(b.dataset.auth));
  const err = t => { const e = $('#a-err'); e.textContent = t; e.hidden = false; };
  const tr = m => /Invalid login/i.test(m) ? 'Correo o contraseña incorrectos.' : /Email not confirmed/i.test(m) ? 'Debes confirmar tu correo: revisa tu bandeja de entrada.' : /already registered/i.test(m) ? 'Ese correo ya tiene cuenta. Ingresa o recupera tu contraseña.' : /Password should be/i.test(m) ? 'La contraseña debe tener al menos 8 caracteres.' : /rate limit/i.test(m) ? 'Demasiados intentos. Espera unos minutos.' : m;
  $('#af').addEventListener('submit', async ev => {
    ev.preventDefault(); const btn = $('#a-go'); btn.disabled = true; $('#a-err').hidden = true;
    try{
      const email = $('#a-email')?.value.trim(), pass = $('#a-pass')?.value;
      if(mode!=='newpass' && !/^\S+@\S+\.\S+$/.test(email||'')) throw 'Ingresa un correo válido.';
      if(mode!=='reset' && (pass||'').length < 8) throw 'La contraseña debe tener al menos 8 caracteres.';
      const redirect = location.origin + location.pathname;
      if(mode==='login'){ const { error } = await sb.auth.signInWithPassword({ email, password:pass }); if(error) throw tr(error.message); }
      if(mode==='signup'){
        const nombre = $('#a-nombre').value.trim(); if(!nombre) throw 'Ingresa tu nombre.';
        const { data, error } = await sb.auth.signUp({ email, password:pass, options:{ data:{ nombre }, emailRedirectTo:redirect } });
        if(error) throw tr(error.message);
        if(!data.session) authScreen('login', `Te enviamos un correo a <b>${esc(email)}</b>. Confirma tu cuenta y luego ingresa. Un administrador debe asignarte un perfil.`);
      }
      if(mode==='reset'){ const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo:redirect }); if(error) throw tr(error.message); authScreen('login', 'Si el correo existe, te enviamos un enlace para crear una nueva contraseña.'); }
      if(mode==='newpass'){ const { error } = await sb.auth.updateUser({ password:pass }); if(error) throw tr(error.message); toast('Contraseña actualizada'); onSession((await sb.auth.getSession()).data.session); }
    }catch(x){ err(typeof x==='string' ? x : (x?.message || 'Error')); }
    finally{ btn.disabled = false; }
  });
  setTimeout(() => a.querySelector('input')?.focus(), 50);
}
function pendingScreen(p){
  const a = $('#auth'); a.hidden = false; $('#app-shell').hidden = true;
  a.querySelector('.auth-form').innerHTML = `<h2>${p && !p.activo ? 'Cuenta bloqueada' : 'Cuenta en revisión'}</h2>
    <p class="muted" style="margin:0">Hola ${esc(p?.nombre || '')}. ${p && !p.activo ? 'Tu acceso fue desactivado. Habla con el administrador.' : 'Tu cuenta está creada. Un administrador debe asignarte un perfil (vendedor, técnico o supervisor) para que puedas usar la aplicación.'}</p>
    <div style="display:grid;gap:10px;margin-top:6px"><button class="btn primary" id="p-retry">Ya me asignaron perfil</button><button class="btn" id="p-out">Cerrar sesión</button></div>`;
  $('#p-retry').onclick = async () => onSession((await sb.auth.getSession()).data.session);
  $('#p-out').onclick = () => sb.auth.signOut();
}
function userSheet(){
  const sh = openSheet(esc(S.me.nombre || ''), `<div class="card" style="padding:14px;display:grid;gap:6px"><div class="sub">${esc(S.me.email || '')}</div><div>Perfil: <b>${esc(ROLES[S.rol])}</b></div></div>
    <div class="actions block"><button class="btn" id="us-pass">Cambiar contraseña</button><button class="btn danger" id="us-out">Cerrar sesión</button></div>`, { eyebrow:'Mi cuenta' });
  $('#us-out', sh).onclick = async () => { closeSheet(); await sb.auth.signOut(); };
  $('#us-pass', sh).onclick = () => { closeSheet(); authScreen('newpass'); };
}

/* ================= arranque ================= */
$('#auth-silos').innerHTML = ['Operativo','Operativo','Con falla'].map(c => siloSVG(c,'')).join('');
let started = false, recovering = false;
async function onSession(session){
  if(recovering) return;
  if(!session){ started = false; S.uid = null; authScreen('login'); return; }
  const { data:p, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if(error){ authScreen('login', 'No se pudo cargar tu perfil: ' + esc(error.message)); return; }
  if(!p || p.rol==='pendiente' || !p.activo){ pendingScreen(p); return; }
  S.me = p; S.uid = p.id; S.rol = p.rol; S.canEdit = p.rol==='admin'; S.canWrite = true;
  S.assets = sbAssets; S.downloads = sbDownloads; S.db = sbDB;
  $('#auth').hidden = true; $('#app-shell').hidden = false;
  $('#user-chip').innerHTML = `<span class="av">${esc((p.nombre||'?').split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase())}</span><span class="un"><b>${esc(p.nombre||'')}</b><small>${ROL_CORTO[p.rol]}</small></span>`;
  if(started) return; started = true;
  buildNav();
  let startView = 'inicio';
  try{ const h = (location.hash||'').slice(1); const lv = localStorage.getItem('silos360.view'); startView = allowed(h) ? h : allowed(lv) ? lv : 'inicio'; }catch(e){}
  go(startView);
  loadGeo();
  const onErr = e => banner('No se pudieron cargar los datos (' + (e?.message || e?.code || 'error') + '). Revisa tu conexión y recarga.');
  sbDB.collection('silos').onSnapshot(s => { S.silos = s.docs.map(d => ({ id:d.id, ...d.data() })); S.ready.s = true; scheduleRender(); }, onErr);
  sbDB.collection('solicitudes').onSnapshot(s => { S.sols = s.docs.map(d => ({ id:d.id, ...d.data() })); S.ready.o = true; scheduleRender(); }, onErr);
  sbDB.collection('eventos').onSnapshot(s => { S.evs = s.docs.map(d => ({ id:d.id, ...d.data() })); S.ready.e = true; scheduleRender(); }, onErr);
  listenRealtime();
  loadMasters().catch(() => {});
  loadDespachos().catch(() => {});
  if(can('admin')){ const { data } = await sb.from('profiles').select('*'); S.users = data || []; updateBadges(); }
}
$('#user-chip').addEventListener('click', userSheet);
sb.auth.onAuthStateChange((event, session) => {
  if(event==='PASSWORD_RECOVERY'){ recovering = true; authScreen('newpass'); return; }
  if(event==='USER_UPDATED'){ recovering = false; }
  if(event==='SIGNED_OUT'){ location.hash = ''; location.reload(); return; }
  if(event==='INITIAL_SESSION' || event==='SIGNED_IN'){ setTimeout(() => onSession(session), 0); }
});
})();

</script>
